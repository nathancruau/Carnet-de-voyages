<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Carnet de Voyages</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Theme & status bar -->
  <meta name="theme-color" content="#0d9488" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- iOS / Safari PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Carnet" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />

  <!-- SEO / sharing -->
  <meta name="description" content="Planifiez, organisez et vivez vos aventures de voyage." />
  <meta name="application-name" content="Carnet de Voyages" />

  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css?v=84" />
  <script>
    (function(){try{
      var d=JSON.parse(localStorage.getItem('carnet_voyages_v1')||'{}');
      var t=(d.settings||{}).theme;
      if(t==='dark')document.documentElement.dataset.theme='dark';
      else if(t==='auto'&&window.matchMedia('(prefers-color-scheme:dark)').matches)
        document.documentElement.dataset.theme='dark';
    }catch(_){}}());
    // Login screen is green — pre-fill the WebView canvas so the gap below
    // position:fixed content shows green instead of the default WebView white
    document.documentElement.style.background = '#0d9488';
    document.body && (document.body.style.background = '#0d9488');
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</head>
<body>

  <!-- Login Screen -->
  <div id="screen-login" class="screen active">
    <div id="login-wrap">
      <div class="login-loading">
        <div class="login-spinner"></div>
        <span>Chargement…</span>
      </div>
    </div>
  </div>

  <!-- Home Screen -->
  <div id="screen-home" class="screen">
    <div class="home-wrap" id="home-wrap"></div>
  </div>

  <!-- App Screen (trip detail) -->
  <div id="screen-app" class="screen">
    <div class="topbar" id="topbar"></div>
    <div class="panels" id="panels"></div>
  </div>

  <!-- My Map Screen -->
  <div id="screen-mymap" class="screen">
    <div id="mymap-wrap"></div>
  </div>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="ov" onclick="window._closeModalOnBg && closeModal()"></div>

  <!-- Offline indicator -->
  <div class="offline-bar" id="offline-bar">📶 Hors-ligne — les modifications sont enregistrées et se synchroniseront à la reconnexion</div>

  <!-- Notification -->
  <div class="notif" id="notif">
    <span id="n-ic">✓</span>
    <span id="n-msg"></span>
  </div>

  <script src="vendor/leaflet.js"></script>
  <script>
    function _showErr(msg, detail) {
      // Don't replace body if already showing an error (prevents double-trigger)
      if (document.getElementById('_err-box')) return;
      var box = document.createElement('div');
      box.id = '_err-box';
      box.style.cssText = 'font-family:monospace;padding:24px;background:#fee;border:2px solid red;margin:20px;border-radius:8px;position:fixed;top:20px;left:20px;right:20px;z-index:9999999';
      box.innerHTML = '<b>Erreur :</b> ' + msg
        + (detail ? '<br><span style="font-size:11px;color:#888">' + detail + '</span>' : '')
        + '<br><br><button onclick="location.reload()" style="padding:6px 14px;background:#0d9488;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700">↺ Recharger</button>'
        + ' <button onclick="caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))).then(()=>location.reload())" style="padding:6px 14px;background:#666;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;margin-left:6px">Vider cache + recharger</button>';
      document.body.appendChild(box);
    }
    window.addEventListener('error', function(e) {
      var detail = e.filename ? e.filename.split('/').pop() + ':' + e.lineno : '';
      // "Script error." = module load failure or cross-origin — offer cache clear
      _showErr(e.message || 'Erreur inconnue', detail);
    });
    window.addEventListener('unhandledrejection', function(e) {
      _showErr('Promise: ' + (e.reason?.message || String(e.reason)), '');
    });
  </script>
  <!-- PWA install prompt (Android) -->
  <div id="pwa-install-bar" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:99999;
    background:linear-gradient(135deg,#0d9488,#0b7a6e);color:#fff;
    padding:12px 16px;display:none;align-items:center;gap:12px;
    box-shadow:0 -2px 20px rgba(0,0,0,.18);font-family:var(--fn)">
    <img src="/icons/icon-192.png" style="width:40px;height:40px;border-radius:10px;flex-shrink:0" alt="">
    <div style="flex:1;min-width:0">
      <div style="font-size:13px;font-weight:700">Installer Carnet de Voyages</div>
      <div style="font-size:11px;opacity:.85">Accès rapide depuis votre écran d'accueil</div>
    </div>
    <button id="pwa-install-btn"
      style="background:#fff;color:#0d9488;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;white-space:nowrap">
      Installer
    </button>
    <button id="pwa-install-dismiss"
      style="background:none;border:none;color:#fff;opacity:.7;cursor:pointer;font-size:18px;padding:0 4px;flex-shrink:0;line-height:1">
      ✕
    </button>
  </div>

  <script>
    // Android / Chrome: intercept beforeinstallprompt
    let _pwaPrompt = null;
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      _pwaPrompt = e;
      // Don't show if already dismissed in this session
      if (!sessionStorage.getItem('pwa-dismissed')) {
        const bar = document.getElementById('pwa-install-bar');
        if (bar) bar.style.display = 'flex';
      }
    });
    document.getElementById('pwa-install-btn')?.addEventListener('click', () => {
      if (!_pwaPrompt) return;
      _pwaPrompt.prompt();
      _pwaPrompt.userChoice.then(() => {
        _pwaPrompt = null;
        const bar = document.getElementById('pwa-install-bar');
        if (bar) bar.style.display = 'none';
      });
    });
    document.getElementById('pwa-install-dismiss')?.addEventListener('click', () => {
      sessionStorage.setItem('pwa-dismissed', '1');
      const bar = document.getElementById('pwa-install-bar');
      if (bar) bar.style.display = 'none';
    });
    // Hide if already running as standalone
    if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
      const bar = document.getElementById('pwa-install-bar');
      if (bar) bar.style.display = 'none';
    }
  </script>
<script type="module" src="js/app.js?v=84"></script>
</body>
</html>
