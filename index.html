<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carnet de Voyages</title>
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=42" />
  <script>
    (function(){try{
      var d=JSON.parse(localStorage.getItem('carnet_voyages_v1')||'{}');
      var t=(d.settings||{}).theme;
      if(t==='dark')document.documentElement.dataset.theme='dark';
      else if(t==='auto'&&window.matchMedia('(prefers-color-scheme:dark)').matches)
        document.documentElement.dataset.theme='dark';
    }catch(_){}}());
  </script>
</head>
<body>

  <!-- Login Screen -->
  <div id="screen-login" class="screen active">
    <div id="login-wrap">
      <div class="login-loading">
        <div class="login-spinner"></div>
        <span>Chargement…</span>
      </div>
    </div>
  </div>

  <!-- Home Screen -->
  <div id="screen-home" class="screen">
    <div class="home-wrap" id="home-wrap"></div>
  </div>

  <!-- App Screen (trip detail) -->
  <div id="screen-app" class="screen">
    <div class="topbar" id="topbar"></div>
    <div class="panels" id="panels"></div>
  </div>

  <!-- My Map Screen -->
  <div id="screen-mymap" class="screen">
    <div id="mymap-wrap"></div>
  </div>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="ov" onclick="window._closeModalOnBg && closeModal()"></div>

  <!-- Notification -->
  <div class="notif" id="notif">
    <span id="n-ic">✓</span>
    <span id="n-msg"></span>
  </div>

  <script src="vendor/leaflet.js"></script>
  <script>
    window.addEventListener('error', function(e) {
      document.body.innerHTML = '<div style="font-family:monospace;padding:24px;background:#fee;border:2px solid red;margin:20px;border-radius:8px">'
        + '<b>Erreur JavaScript :</b><br>' + (e.message || '') + '<br>'
        + (e.filename ? e.filename.split('/').pop() + ':' + e.lineno : '')
        + '</div>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.body.innerHTML = '<div style="font-family:monospace;padding:24px;background:#fee;border:2px solid red;margin:20px;border-radius:8px">'
        + '<b>Erreur Promise :</b><br>' + (e.reason?.message || String(e.reason))
        + '</div>';
    });
  </script>
  <script type="module" src="js/app.js?v=42"></script>
</body>
</html>
