<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carnet de Voyages</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Home Screen -->
  <div id="screen-home" class="screen active">
    <div class="home-wrap" id="home-wrap"></div>
  </div>

  <!-- App Screen (trip detail) -->
  <div id="screen-app" class="screen">
    <div class="topbar" id="topbar"></div>
    <div class="panels" id="panels"></div>
  </div>

  <!-- My Map Screen -->
  <div id="screen-mymap" class="screen">
    <div id="mymap-wrap" style="width:100%;height:100%;display:flex;flex-direction:column;"></div>
  </div>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="ov" onclick="window._closeModalOnBg && closeModal()"></div>

  <!-- Notification -->
  <div class="notif" id="notif">
    <span id="n-ic">✓</span>
    <span id="n-msg"></span>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
